name: Daily trending snapshots

on:
  schedule:
    - cron: "17 2 * * *"
  workflow_dispatch:
    inputs:
      platform:
        description: Platform to collect
        required: true
        default: all
        type: choice
        options:
          - all
          - gitlab
          - gitee
      date:
        description: UTC snapshot date (defaults to today)
        required: false
        type: string
      observed_at:
        description: ISO observation time (defaults to now)
        required: false
        type: string

concurrency:
  group: daily-snapshot-publish
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  collect:
    strategy:
      fail-fast: false
      matrix:
        platform: ${{ fromJSON(github.event_name == 'workflow_dispatch' && inputs.platform != 'all' && format('["{0}"]', inputs.platform) || '["gitlab","gitee"]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.14

      - run: bun install --frozen-lockfile

      - id: timing
        name: Resolve observation time
        env:
          INPUT_DATE: ${{ inputs.date }}
          INPUT_OBSERVED_AT: ${{ inputs.observed_at }}
        run: |
          observed_at="${INPUT_OBSERVED_AT:-$(date -u +%Y-%m-%dT%H:%M:%S.000Z)}"
          snapshot_date="${INPUT_DATE:-${observed_at:0:10}}"
          echo "observed_at=$observed_at" >> "$GITHUB_OUTPUT"
          echo "snapshot_date=$snapshot_date" >> "$GITHUB_OUTPUT"

      - id: collect
        name: Collect ${{ matrix.platform }}
        continue-on-error: true
        env:
          GITLAB_TOKEN: ${{ secrets.GITLAB_TOKEN }}
          GITEE_TOKEN: ${{ secrets.GITEE_TOKEN }}
        run: |
          bun run src/cli.ts collect \
            --platform "${{ matrix.platform }}" \
            --date "${{ steps.timing.outputs.snapshot_date }}" \
            --observed-at "${{ steps.timing.outputs.observed_at }}" \
            --repository "$GITHUB_WORKSPACE" \
            --output "$RUNNER_TEMP/collection"

      - name: Upload raw and normalized collection artifacts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: collection-${{ matrix.platform }}-${{ github.run_id }}
          path: ${{ runner.temp }}/collection
          if-no-files-found: warn
          retention-days: 7

      - name: Report incomplete collection
        if: steps.collect.outcome == 'failure'
        run: exit 1

  publish:
    if: always()
    needs: collect
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      issues: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 1

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.14

      - run: bun install --frozen-lockfile

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: collection-*-${{ github.run_id }}
          path: ${{ runner.temp }}/collections
          merge-multiple: true

      - id: timing
        name: Resolve observation date
        env:
          INPUT_DATE: ${{ inputs.date }}
          INPUT_OBSERVED_AT: ${{ inputs.observed_at }}
        run: |
          observed_at="${INPUT_OBSERVED_AT:-$(date -u +%Y-%m-%dT%H:%M:%S.000Z)}"
          snapshot_date="${INPUT_DATE:-${observed_at:0:10}}"
          echo "snapshot_date=$snapshot_date" >> "$GITHUB_OUTPUT"

      - name: Publish normalized artifacts
        run: |
          bun run src/cli.ts publish \
            --input "$RUNNER_TEMP/collections" \
            --target "$GITHUB_WORKSPACE"

      - name: Enforce repository growth gates
        run: bun run src/cli.ts verify-growth --repository "$GITHUB_WORKSPACE"

      - name: Commit daily snapshot
        run: |
          git add data config/watchlists
          if git diff --cached --quiet; then
            echo "No snapshot changes"
            exit 0
          fi
          git -c user.name="github-actions[bot]" \
              -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
              commit -m "data: add daily trending snapshots"
          git push

      - name: Post Top-N rankings to standing issues
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          bun run src/cli.ts post-ranking-issues \
            --repository "$GITHUB_WORKSPACE" \
            --date "${{ steps.timing.outputs.snapshot_date }}"
